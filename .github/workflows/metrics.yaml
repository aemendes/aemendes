name: GitHub Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          # A personal access token (METRICS_TOKEN secret) unlocks private-repo stats; falls back to GITHUB_TOKEN
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: aemendes
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Lisbon
          config_octicon: true
          config_twemoji: true

          plugin_languages: true
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_other: true
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_isocalendar: true
          plugin_isocalendar_duration: full-year

          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          committer_message: "📈 Update GitHub metrics [skip ci]"
